<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibocin Chat Widget</title>
  <style>
    /* Chat Widget Styles */
    .chat-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }

    .chat-toggle {
      width: 60px;
      height: 60px;
      background: #00ff00;
      border: 2px solid #00ff00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      transition: all 0.3s ease;
      color: #000;
      font-size: 24px;
    }

    .chat-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
    }

    .chat-container {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 400px;
      height: 500px;
      background: #1a1a1a;
      border: 2px solid #00ff00;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #333;
      padding: 15px;
      border-bottom: 1px solid #00ff00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      color: #00ff00;
      font-weight: bold;
      font-size: 14px;
    }

    .chat-close {
      background: none;
      border: none;
      color: #00ff00;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-close:hover {
      color: #39ff14;
    }

    .chat-iframe {
      flex: 1;
      border: none;
      background: #000;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .chat-container {
        width: calc(100vw - 40px);
        height: calc(100vh - 120px);
        right: 20px;
        left: 20px;
        bottom: 100px;
      }
    }

    /* Animation for slide-in */
    .chat-container.show {
      display: flex;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Pulse animation for notification */
    .chat-toggle.has-notification {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      }

      50% {
        box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
      }

      100% {
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      }
    }
  </style>
</head>

<body>
  <div class="chat-widget">
    <!-- Chat Toggle Button -->
    <div class="chat-toggle" id="chatToggle">
      🤖
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="chat-title">Tibocin Bitcoin Bot</div>
        <button class="chat-close" id="chatClose">×</button>
      </div>
      <iframe src="https://tibocin-beep-boop.hf.space" class="chat-iframe" frameborder="0" width="100%"
        height="100%"></iframe>
    </div>
  </div>

  <script>
    // Chat Widget Functionality
    class ChatWidget {
      constructor() {
        this.toggle = document.getElementById('chatToggle');
        this.container = document.getElementById('chatContainer');
        this.close = document.getElementById('chatClose');
        this.isOpen = false;
        this.init();
      }

      init() {
        // Toggle chat
        this.toggle.addEventListener('click', () => {
          this.toggleChat();
        });

        // Close chat
        this.close.addEventListener('click', () => {
          this.closeChat();
        });

        // Close on escape key
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && this.isOpen) {
            this.closeChat();
          }
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
          if (this.isOpen && !this.container.contains(e.target) && !this.toggle.contains(e.target)) {
            this.closeChat();
          }
        });

        // Add notification effect after 5 seconds
        setTimeout(() => {
          this.toggle.classList.add('has-notification');
        }, 5000);
      }

      toggleChat() {
        if (this.isOpen) {
          this.closeChat();
        } else {
          this.openChat();
        }
      }

      openChat() {
        this.container.classList.add('show');
        this.isOpen = true;
        this.toggle.classList.remove('has-notification');

        // Focus the iframe
        setTimeout(() => {
          const iframe = this.container.querySelector('iframe');
          if (iframe) {
            iframe.focus();
          }
        }, 300);
      }

      closeChat() {
        this.container.classList.remove('show');
        this.isOpen = false;
      }

      // Method to show notification
      showNotification() {
        this.toggle.classList.add('has-notification');
      }

      // Method to hide notification
      hideNotification() {
        this.toggle.classList.remove('has-notification');
      }
    }

    // Initialize chat widget
    const chatWidget = new ChatWidget();

    // Expose to global scope for external control
    window.tibocinChat = chatWidget;
  </script>
</body>

</html>
