<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .primary-green { fill: #00ff00; }
      .secondary-green { fill: #00cc00; }
      .dark-green { fill: #006600; }
      .terminal-green { fill: #39ff14; }
      .glow { filter: url(#glow); }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#000000"/>
  
  <!-- Omar Rayo-style geometric background -->
  <polygon points="0,0 50,0 25,50 0,50" class="primary-green" opacity="0.3"/>
  <polygon points="150,0 200,0 200,50 175,50" class="secondary-green" opacity="0.3"/>
  <polygon points="0,150 50,150 25,200 0,200" class="dark-green" opacity="0.3"/>
  <polygon points="150,150 200,150 200,200 175,200" class="terminal-green" opacity="0.3"/>
  
  <!-- Pixelated face structure -->
  <!-- Forehead -->
  <rect x="60" y="40" width="80" height="20" class="primary-green"/>
  <rect x="65" y="45" width="70" height="10" class="secondary-green"/>
  
  <!-- Eyes -->
  <rect x="70" y="70" width="15" height="8" class="terminal-green"/>
  <rect x="115" y="70" width="15" height="8" class="terminal-green"/>
  <rect x="72" y="72" width="11" height="4" class="primary-green"/>
  <rect x="117" y="72" width="11" height="4" class="primary-green"/>
  
  <!-- Nose -->
  <rect x="95" y="85" width="10" height="15" class="secondary-green"/>
  <rect x="97" y="87" width="6" height="11" class="dark-green"/>
  
  <!-- Mouth -->
  <rect x="85" y="110" width="30" height="4" class="primary-green"/>
  
  <!-- Cheeks -->
  <rect x="50" y="90" width="15" height="20" class="secondary-green" opacity="0.7"/>
  <rect x="135" y="90" width="15" height="20" class="secondary-green" opacity="0.7"/>
  
  <!-- Jaw -->
  <rect x="70" y="120" width="60" height="25" class="primary-green"/>
  <rect x="75" y="125" width="50" height="15" class="secondary-green"/>
  
  <!-- Hair -->
  <rect x="55" y="35" width="90" height="15" class="dark-green"/>
  <rect x="50" y="30" width="100" height="10" class="primary-green"/>
  <rect x="45" y="25" width="110" height="8" class="secondary-green"/>
  
  <!-- Omar Rayo-style striping on face -->
  <rect x="60" y="60" width="5" height="60" class="terminal-green" opacity="0.8"/>
  <rect x="135" y="60" width="5" height="60" class="terminal-green" opacity="0.8"/>
  <rect x="75" y="80" width="50" height="3" class="dark-green" opacity="0.6"/>
  <rect x="75" y="100" width="50" height="3" class="dark-green" opacity="0.6"/>
  
  <!-- Geometric accent lines -->
  <line x1="40" y1="40" x2="60" y2="60" stroke="#00ff00" stroke-width="2" opacity="0.5"/>
  <line x1="160" y1="40" x2="140" y2="60" stroke="#00cc00" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="160" x2="60" y2="140" stroke="#006600" stroke-width="2" opacity="0.5"/>
  <line x1="160" y1="160" x2="140" y2="140" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.3" class="glow"/>
</svg> 