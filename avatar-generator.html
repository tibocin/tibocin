<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Generator</title>
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 20px;
      font-family: 'Courier New', monospace;
      color: #00ff00;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .avatar-display {
      text-align: center;
      margin: 20px 0;
    }

    .download-btn {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .download-btn:hover {
      background: #39ff14;
    }

    .ascii-preview {
      font-size: 4px;
      line-height: 4px;
      color: #00ff00;
      text-align: center;
      white-space: pre;
      margin: 20px 0;
      border: 1px solid #00ff00;
      padding: 10px;
      background: #1a1a1a;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🤖 Tibocin Avatar Generator</h1>

    <div class="avatar-display">
      <h2>SVG Version</h2>
      <img src="avatar.svg" alt="Tibocin Avatar" width="200" height="200">
      <br>
      <button class="download-btn" onclick="downloadSVG()">Download SVG</button>
    </div>

    <div class="avatar-display">
      <h2>ASCII Art Version</h2>
      <div class="ascii-preview" id="asciiPreview">
        <!-- ASCII art will be loaded here -->
      </div>
      <button class="download-btn" onclick="downloadASCII()">Download ASCII Text</button>
    </div>

    <div class="avatar-display">
      <h2>PNG Generation</h2>
      <button class="download-btn" onclick="generatePNG()">Generate PNG</button>
      <canvas id="avatarCanvas" width="400" height="400" style="display: none;"></canvas>
    </div>
  </div>

  <script>
    // Load ASCII art
    fetch('ascii-art.txt')
      .then(response => response.text())
      .then(data => {
        document.getElementById('asciiPreview').textContent = data;
      })
      .catch(error => {
        console.log('Error loading ASCII art:', error);
        document.getElementById('asciiPreview').textContent = 'ASCII art loading...';
      });

    function downloadSVG() {
      const link = document.createElement('a');
      link.href = 'avatar.svg';
      link.download = 'tibocin-avatar.svg';
      link.click();
    }

    function downloadASCII() {
      const asciiContent = document.getElementById('asciiPreview').textContent;
      const blob = new Blob([asciiContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'tibocin-avatar.txt';
      link.click();
      URL.revokeObjectURL(url);
    }

    function generatePNG() {
      const canvas = document.getElementById('avatarCanvas');
      const ctx = canvas.getContext('2d');

      // Clear canvas
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 400, 400);

      // Draw pixelated avatar
      const colors = {
        primary: '#00ff00',
        secondary: '#00cc00',
        dark: '#006600',
        terminal: '#39ff14'
      };

      // Draw face structure
      ctx.fillStyle = colors.primary;
      ctx.fillRect(120, 80, 160, 40); // forehead
      ctx.fillRect(140, 90, 120, 20); // forehead detail

      ctx.fillStyle = colors.terminal;
      ctx.fillRect(140, 140, 30, 16); // left eye
      ctx.fillRect(230, 140, 30, 16); // right eye

      ctx.fillStyle = colors.primary;
      ctx.fillRect(144, 144, 22, 8); // left eye detail
      ctx.fillRect(234, 144, 22, 8); // right eye detail

      ctx.fillStyle = colors.secondary;
      ctx.fillRect(190, 170, 20, 30); // nose
      ctx.fillRect(194, 174, 12, 22); // nose detail

      ctx.fillStyle = colors.primary;
      ctx.fillRect(170, 220, 60, 8); // mouth

      // Omar Rayo-style striping
      ctx.fillStyle = colors.terminal;
      ctx.fillRect(120, 120, 10, 120); // left stripe
      ctx.fillRect(270, 120, 10, 120); // right stripe

      ctx.fillStyle = colors.dark;
      ctx.fillRect(150, 160, 100, 6); // horizontal stripe 1
      ctx.fillRect(150, 200, 100, 6); // horizontal stripe 2

      // Download PNG
      const link = document.createElement('a');
      link.download = 'tibocin-avatar.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>

</html>
