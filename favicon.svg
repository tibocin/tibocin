<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Black background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Double-line border with small gap -->
  <rect x="4" y="4" width="24" height="24" fill="none" stroke="#39ff14" stroke-width="1" filter="drop-shadow(0 0 1px #39ff14)"/>
  <rect x="6" y="6" width="20" height="20" fill="none" stroke="#39ff14" stroke-width="1" filter="drop-shadow(0 0 1px #39ff14)"/>
  
  <!-- T shape with connecting lines -->
  <!-- Horizontal bar - wider than individual stem blocks -->
  <rect x="8" y="8" width="16" height="3" fill="#39ff14" filter="drop-shadow(0 0 2px #39ff14)"/>
  
  <!-- Vertical stem - 4 individual blocks with gaps -->
  <rect x="12" y="12" width="2" height="2" fill="#39ff14" filter="drop-shadow(0 0 2px #39ff14)"/>
  <rect x="12" y="15" width="2" height="2" fill="#39ff14" filter="drop-shadow(0 0 2px #39ff14)"/>
  <rect x="12" y="18" width="2" height="2" fill="#39ff14" filter="drop-shadow(0 0 2px #39ff14)"/>
  <rect x="12" y="21" width="2" height="2" fill="#39ff14" filter="drop-shadow(0 0 2px #39ff14)"/>
  
  <!-- Connecting lines/Internal outline -->
  <!-- Lines along outer edges of vertical stem -->
  <path d="M12 12 L12 24 M14 12 L14 24" stroke="#39ff14" stroke-width="0.5" fill="none" filter="drop-shadow(0 0 1px #39ff14)"/>
  <!-- Lines along bottom edge of horizontal bar and top edge of lowest stem block -->
  <path d="M8 11 L24 11 M12 23 L14 23" stroke="#39ff14" stroke-width="0.5" fill="none" filter="drop-shadow(0 0 1px #39ff14)"/>
</svg> 